<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MundoDeCartas - Tira tus Cartas</title>
  
  <!-- Tipografías Esotéricas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Enlace a la hoja de estilos externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="tarot-section">
    <!-- El Checkbox oculto que controla la interfaz interactiva con CSS Puro -->
    <input type="checkbox" id="reveal-trigger">

    <!-- ==========================================
         VISTA 1: FORMULARIO DE CONSULTA
         ========================================== -->
    <div class="consultation-area">
      <h2 class="section-title">Tira Tus Cartas</h2>
      <p class="section-subtitle">Concéntrate, visualiza tu destino y consulta al oráculo.</p>
      
      <div class="mystic-form">
        <div class="form-group">
          <label for="nombre">Nombre del Consultante</label>
          <input type="text" id="nombre" placeholder="Ingresa tu nombre..." autocomplete="off">
        </div>
        
        <div class="form-group">
          <label for="fecha">Fecha de Nacimiento</label>
          <input type="date" id="fecha">
        </div>

        <div class="form-group full-width">
          <label for="pregunta">Tu Pregunta al Tarot</label>
          <textarea id="pregunta" placeholder="¿Qué deseas saber? (Ej. ¿Es el camino correcto para mi futuro?)"></textarea>
        </div>

        <!-- Este label actúa como el botón que activa el checkbox #reveal-trigger -->
        <label for="reveal-trigger" class="btn-reveal">
          Revelar mi Destino
        </label>
      </div>
    </div>

    <!-- ==========================================
         VISTA 2: RESULTADOS Y CARTAS REVELADAS
         ========================================== -->
    <div class="results-area">
      
      <!-- El Veredicto Definitivo -->
      <div class="verdict-container">
        <p class="verdict-label">El cosmos ha respondido a tu consulta:</p>
        <h1 class="verdict-text">SÍ</h1>
      </div>

      <!-- Las 3 Cartas (Rider-Waite, Wikimedia Commons URLs) -->
      <div class="cards-grid">
        
        <!-- Carta 1: El Mago -->
        <div class="tarot-card">
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
              <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/RWS_Tarot_01_Magician.jpg" alt="El Mago - Rider Waite Tarot">
            </div>
          </div>
          <p class="card-caption">I. El Mago</p>
        </div>

        <!-- Carta 2: La Estrella -->
        <div class="tarot-card">
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
              <img src="https://upload.wikimedia.org/wikipedia/commons/d/db/RWS_Tarot_17_Star.jpg" alt="La Estrella - Rider Waite Tarot">
            </div>
          </div>
          <p class="card-caption">XVII. La Estrella</p>
        </div>

        <!-- Carta 3: El Sol -->
        <div class="tarot-card">
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
              <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/RWS_Tarot_19_Sun.jpg" alt="El Sol - Rider Waite Tarot">
            </div>
          </div>
          <p class="card-caption">XIX. El Sol</p>
        </div>

      </div>

      <!-- Botón para reiniciar (desmarca el checkbox mediante el atributo for) -->
      <div class="action-footer">
        <label for="reveal-trigger" class="btn-reset">Cerrar portal y hacer otra consulta</label>
      </div>

    </div>
  </section>

</body>
</html>
